name: Build LaTeX

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que a tag está na main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "A tag $GITHUB_REF_NAME não aponta para um commit da main."
            exit 1
          fi

      - name: Compilar
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/main.pdf --title "Artefato" --notes "Gerado a partir de $GITHUB_SHA" --verify-tag
