name: Build LaTeX

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Instalar dependências
        run: pacman -Syu --noconfirm --needed git make texlive-basic texlive-latex texlive-latexrecommended texlive-latexextra texlive-binextra texlive-fontsrecommended

      - uses: actions/checkout@v4

      - name: Compilar
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: build/main.pdf
